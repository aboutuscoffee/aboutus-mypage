name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # SHA-256ハッシュ（64桁の16進）以外が登録されていたら、平文が公開されないよう空にする
      - name: Build
        run: |
          if [[ ! "$RAW_HASH" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::warning::VITE_PASSWORD_HASH がSHA-256ハッシュではないため無視しました"
            RAW_HASH=""
          fi
          VITE_PASSWORD_HASH="$RAW_HASH" npm run build
        env:
          RAW_HASH: ${{ secrets.VITE_PASSWORD_HASH }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
