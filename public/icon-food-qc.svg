<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="lens" cx="0.35" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FBFAF7"/>
      <stop offset="0.55" stop-color="#E8E1D3"/>
      <stop offset="1" stop-color="#C7B9A3"/>
    </radialGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A6F55"/>
      <stop offset="1" stop-color="#5A4A3C"/>
    </linearGradient>
  </defs>

  <!-- background tile -->
  <rect width="512" height="512" rx="112" fill="#F3ECE1"/>

  <!-- handle shadow -->
  <rect x="318" y="330" width="42" height="150" rx="20" transform="rotate(45 339 405)" fill="#5A4A3C" opacity="0.15"/>

  <!-- handle -->
  <rect x="318" y="326" width="40" height="150" rx="20" transform="rotate(45 338 401)" fill="url(#handle)"/>

  <!-- lens ring -->
  <circle cx="224" cy="224" r="122" fill="#7A6650"/>
  <circle cx="224" cy="224" r="100" fill="url(#lens)"/>

  <!-- checklist marks inside lens -->
  <g stroke="#9C6B4F" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M172 210 L196 234 L244 182"/>
  </g>
  <line x1="168" y1="256" x2="272" y2="256" stroke="#7A6650" stroke-width="8" stroke-linecap="round" opacity="0.55"/>

  <!-- glass shine -->
  <path d="M172 168 Q190 140 228 136" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.75"/>
</svg>
